
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Video</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #e7eaf0;
      --accent: #2457a7;
      --page: #f7f8fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 64px 24px;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 44px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(23, 32, 51, 0.06);
    }

    h1 {
      margin: 0 0 34px;
      text-align: center;
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #080808;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
    }

    .download {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 28px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .download p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .download a {
      flex: 0 0 auto;
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .download a:hover {
      background: #194785;
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 12px;
      }

      main {
        padding: 26px 18px;
        border-radius: 14px;
      }

      .download {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main>

    <h1>Demo Video</h1>

    <video controls playsinline preload="metadata">
      <source src="demo.mp4" type="video/mp4">
      Your browser does not support HTML5 video playback.
    </video>

    <section class="download" aria-label="README download">
      <div>
        <strong>README</strong>
        <p>
          Download the README file for the
          accompanying explanation.
        </p>
      </div>

      <a href="README.md"
         id="readme-download"
         download="README.md">
        Download README
      </a>
    </section>

  </main>

  <script>
    (function () {
      const downloadLink = document.getElementById("readme-download");
      if (!downloadLink) return;

      // GitHub Pages/local hosting use README.md.
      // Anonymous GitHub uses its repository-file endpoint.
      if (window.location.hostname === "anonymous.4open.science") {
        downloadLink.href = "/api/repo/demo-88D2/file/README.md";
      }

      // Keep the native download attribute on both platforms.
      // No fetch(), Blob, or cross-origin request is used.
    })();
  </script>

</body>
</html>
