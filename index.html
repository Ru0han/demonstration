
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Video</title>

  <style>
    body {
      margin: 0;
      padding: 60px 24px;
      background: #ffffff;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      margin: 0 0 35px;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #000;
    }

    .readme {
      margin-top: 24px;
      text-align: right;
      font-size: 14px;
    }

    .readme a {
      color: #2457a7;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main>

    <h1>Demo Video</h1>

    <video controls playsinline preload="metadata">
      <source src="demo.mp4" type="video/mp4">
      Your browser does not support video playback.
    </video>

    <div class="readme">
      <a href="README.md" download>Download README</a>
    </div>

  </main>
</body>
</html>
