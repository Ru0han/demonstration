
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Video</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #e7eaf0;
      --accent: #2457a7;
      --page: #f7f8fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 64px 24px;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 44px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(23, 32, 51, 0.06);
    }

    h1 {
      margin: 0 0 34px;
      text-align: center;
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #080808;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
    }

    .download {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 28px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .download p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .download a {
      flex: 0 0 auto;
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .download a:hover {
      background: #194785;
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 12px;
      }

      main {
        padding: 26px 18px;
        border-radius: 14px;
      }

      .download {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main>

    <h1>Demo Video</h1>

    <video controls playsinline preload="metadata">
      <source src="demo.mp4" type="video/mp4">
      Your browser does not support HTML5 video playback.
    </video>

    <section class="download" aria-label="README download">
      <div>
        <strong>README</strong>
        <p>
          Download the README file for the
          accompanying explanation.
        </p>
      </div>

      <a href="README.md"
         download="README.md"
         id="readme-download">
        Download README
      </a>
    </section>

  </main>

  <script>
    (function () {
      const link = document.getElementById("readme-download");
      if (!link) return;

      // Anonymous GitHub serves repository files through this same-origin API.
      // On ordinary GitHub Pages and when opened locally, keep the relative
      // README.md link and the browser's native download behavior.
      const isAnonymousGitHub =
        window.location.hostname === "anonymous.4open.science";

      if (!isAnonymousGitHub) return;

      const anonymousReadmeUrl =
        "/api/repo/demo-88D2/file/README.md";

      link.href = anonymousReadmeUrl;
      link.removeAttribute("download");

      link.addEventListener("click", async function (event) {
        event.preventDefault();

        const originalText = link.textContent;
        link.textContent = "Preparing download...";

        try {
          const response = await fetch(anonymousReadmeUrl, {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error("README request failed: HTTP " + response.status);
          }

          const blob = await response.blob();
          const objectUrl = URL.createObjectURL(blob);
          const temporaryLink = document.createElement("a");

          temporaryLink.href = objectUrl;
          temporaryLink.download = "README.md";
          document.body.appendChild(temporaryLink);
          temporaryLink.click();
          temporaryLink.remove();

          window.setTimeout(function () {
            URL.revokeObjectURL(objectUrl);
          }, 1000);
        } catch (error) {
          console.error(error);
          // Fallback: open the Anonymous GitHub file endpoint. This may show
          // its preview page, but still lets the user access the README.
          window.location.href = anonymousReadmeUrl;
        } finally {
          link.textContent = originalText;
        }
      });
    })();
  </script>

</body>
</html>
